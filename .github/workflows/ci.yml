name: CI

# The framework is plain Markdown + Python + shell with no build step, so CI just proves the
# load-bearing scripts parse and the guardrail contract holds (tests/test_guardrails.py). This is
# the executable half of CONTRIBUTING.md's verification checklist.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push must not keep occupying the slowest runner (macOS) to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guardrail-tests:
    name: Python contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run python contract tests
        run: python -m pytest tests/ -q

  static-checks:
    name: Syntax & parse checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: bash -n on all shell scripts
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            bash -n "$f" && echo "ok   $f" || { echo "FAIL $f"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail
      - name: py_compile on all Python
        run: |
          set -e
          # shellcheck disable=SC2046
          python -m py_compile $(git ls-files '*.py')
          echo "all python compiled"
      - name: Validate committed JSON parses
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              && echo "ok   $f" || { echo "FAIL $f"; fail=1; }
          done < <(git ls-files '*.json')
          exit $fail
      - name: No broken symlinks
        run: |
          set -e
          fail=0
          while IFS= read -r l; do
            [ -e "$l" ] && echo "ok   $l" || { echo "BROKEN symlink: $l -> $(readlink "$l")"; fail=1; }
          done < <(git ls-files -s | grep '^120000 ' | cut -f2)
          exit $fail
      - name: Markdown relative links resolve
        run: |
          python - <<'PY'
          import re, sys, subprocess, pathlib
          files = subprocess.check_output(["git", "ls-files", "*.md"], text=True).split()
          fence  = re.compile(r'```.*?```', re.DOTALL)
          inline = re.compile(r'`[^`]*`')
          link_re = re.compile(r'(?<!!)\]\(([^)]+)\)')
          bad = []
          for f in files:
              if '/templates/' in f:            # blueprints legitimately hold placeholder links
                  continue
              text = pathlib.Path(f).read_text(encoding="utf-8")
              text = inline.sub('', fence.sub('', text))   # drop code — it holds link-SYNTAX examples
              base = pathlib.Path(f).parent
              for m in link_re.finditer(text):
                  t = m.group(1).split('#', 1)[0].strip()
                  if (not t or t.startswith(('http://', 'https://', 'mailto:', 'git@', '/'))
                          or any(c in t for c in '<>$` ')):
                      continue
                  if not (base / t).exists():
                      bad.append(f"{f}: {t}")
          if bad:
              print("BROKEN markdown links:")
              print("\n".join("  " + b for b in bad))
              sys.exit(1)
          print(f"all markdown relative links resolve ({len(files)} md files)")
          PY

  shell-contract-tests:
    name: Shell contracts + E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install gnupg (macOS)
        if: runner.os == 'macOS'
        run: command -v gpg >/dev/null 2>&1 || brew install --quiet gnupg
      - name: Shell contract suites + E2E lifecycle
        # macOS deliberately uses /bin/bash 3.2 — the framework claims 3.2 portability and the
        # hooks run under the system bash on user machines; this is where that claim is executed,
        # not just reviewed. ($BASH propagates into run.sh so every suite runs under it.)
        run: |
          SH=bash
          [ "$RUNNER_OS" = "macOS" ] && SH=/bin/bash
          "$SH" tests/shell/run.sh
          "$SH" tests/e2e/lifecycle.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck (error severity) on all tracked shell scripts
        run: |
          set -e
          # shellcheck disable=SC2046
          shellcheck -S error $(git ls-files '*.sh')
          echo "shellcheck clean at error severity"

  windows-checks:
    name: Windows (bootstrap.ps1 + python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $errs = $null
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "parsed ok: $($_.Name)"
          }
      - name: Python contract tests under Windows path semantics
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_capture_session.py -q
