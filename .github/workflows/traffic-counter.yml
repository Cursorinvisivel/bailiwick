name: Traffic counter

# GitHub only keeps the last 14 days of clone/view traffic (the Insights page and the traffic
# API expose the same rolling window). This workflow snapshots that window daily via
# scripts/traffic_counter.py and accumulates an all-time per-day ledger, published as a
# single-commit data-only `traffic-data` branch that the README badges read through the
# shields.io endpoint. A missed run loses nothing as long as the gap stays under 14 days.
#
# The push trigger (on this workflow and its script) makes the first push after setup run
# immediately instead of waiting for the next cron slot. Until the first successful snapshot,
# grey "collecting…" placeholder badges are published so the README never shows shields.io's
# "resource not found" error.
#
# One-time setup: the Actions-issued GITHUB_TOKEN cannot read the traffic API, so create a
# fine-grained PAT for this repository with permission "Administration: read-only" (or a
# classic PAT with `repo` scope) and store it as the Actions secret TRAFFIC_PAT.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/traffic-counter.yml"
      - "scripts/traffic_counter.py"

permissions:
  contents: write

concurrency:
  group: traffic-counter
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot & accumulate traffic
    runs-on: ubuntu-latest
    env:
      # Job-level so the opt-in private-metrics step can gate on them in `if:`
      # (the secrets context is not available in step-level if conditions).
      METRICS_REPO: ${{ secrets.PRIVATE_METRICS_REPO }}
      METRICS_TOKEN: ${{ secrets.PRIVATE_METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore accumulated ledger
        id: restore
        run: |
          if git fetch origin traffic-data && git show FETCH_HEAD:traffic-data.json > traffic-data.json; then
            echo "have-data=true" >> "$GITHUB_OUTPUT"
          else
            echo "have-data=false" >> "$GITHUB_OUTPUT"
            echo "no traffic-data branch yet — starting a fresh ledger"
          fi
      - name: Seed "collecting" placeholder badges (first run only)
        if: steps.restore.outputs.have-data == 'false'
        run: |
          mkdir -p badges
          for pair in views:views clones:cloners; do
            printf '{"schemaVersion":1,"label":"%s","message":"collecting…","color":"lightgrey","cacheSeconds":300}\n' \
              "${pair#*:}" > "badges/${pair%%:*}.json"
          done
          printf '{"days": {}}\n' > traffic-data.json
      - name: Snapshot traffic API and accumulate
        id: snapshot
        # First run publishes the placeholders even if the snapshot fails (bad PAT, API
        # outage); the final step still fails the run so the problem stays visible.
        continue-on-error: true
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: python scripts/traffic_counter.py --data traffic-data.json --badge-dir badges
      - name: Publish traffic-data branch
        if: steps.snapshot.outcome == 'success' || steps.restore.outputs.have-data == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir publish
          cp traffic-data.json badges/views.json badges/clones.json publish/
          cd publish
          git init -q -b traffic-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "traffic: snapshot $(date -u +%F)"
          # Single-commit orphan branch, force-pushed each run: continuity lives in the ledger
          # JSON (restored above), so the branch never accumulates history.
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" traffic-data
      - name: Snapshot top referrers & paths to the private metrics repo
        # Personal-only metric: top referrers/paths never land on the public traffic-data
        # branch (on a public repo every Actions output — logs, artifacts, branches — is
        # world-readable). Opt-in: this step runs only when both secrets exist:
        #   PRIVATE_METRICS_REPO   e.g. "Cursorinvisivel/bailiwick-private-metrics" (private!)
        #   PRIVATE_METRICS_TOKEN  fine-grained PAT with "Contents: read and write" on that repo
        if: steps.snapshot.outcome == 'success' && env.METRICS_REPO != '' && env.METRICS_TOKEN != ''
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: |
          set -e
          git clone -q --depth 1 "https://x-access-token:${METRICS_TOKEN}@github.com/${METRICS_REPO}.git" private-metrics
          python scripts/traffic_counter.py --referrers-data private-metrics/referrers-data.json
          cd private-metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add referrers-data.json
          git diff --cached --quiet || {
            git commit -q -m "traffic: popular snapshot $(date -u +%F)"
            git push -q
          }
      - name: Surface a failed snapshot
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "::error::Traffic snapshot failed — see the 'Snapshot traffic API and accumulate' step."
          exit 1
