{% extends "base.html" %}

{#- Brand fonts are self-hosted (assets/fonts, @font-face in brand.css) so no visitor request
    goes to a third party such as Google Fonts. -#}
{% block extrahead %}
  <link rel="preload" href="{{ 'assets/fonts/Archivo-Variable.woff2' | url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ 'assets/fonts/JetBrainsMono-Variable.woff2' | url }}" as="font" type="font/woff2" crossorigin>
{% endblock %}
